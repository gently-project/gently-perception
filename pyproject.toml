[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gently-perception"
version = "0.1.0"
description = "VLM-based perception harness for developmental biology microscopy"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Shroff Lab"},
]

dependencies = [
    "anthropic>=0.40.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "moderngl>=5.10",
    "scipy>=1.10",
]

[project.optional-dependencies]
benchmark = [
    "tifffile>=2024.1.30",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
include = ["gently_perception*", "harness*"]

[tool.pyright]
extraPaths = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
